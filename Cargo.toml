[package]
name = "novoid-core"
version = "2.7.7"
edition = "2021"
description = "High-performance Rust proxy server for Anthropic Messages API to Google Cloud Code"
license = "MIT"

[lib]
name = "novoid_core"
path = "src/lib.rs"

[[bin]]
name = "novoid-core"
path = "src/main.rs"

[[bin]]
name = "acc"
path = "src/bin/acc.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors"] }
rust-embed = "8"
mime_guess = "2"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "deflate", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
url = "2"
regex = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
tracing = "0.1"
async-stream = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
